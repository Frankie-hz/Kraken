[package]
name = "kraken"
version = "1.0.0"
description = "Kraken"
authors = ["InoUno"]
license = "AGPL-3.0"
repository = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = ["image-png"] }
tauri-plugin-window-state = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
specta = "2.0.0-rc.21"
specta-typescript = { version = "0.0.9" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.25"
glob = "0.3.1"
dats = { path = "../../crates/dats", features = ["specta"] }
processor = { path = "../../crates/processor" }
project = { path = "../../crates/project" }
anyhow = "1.0.72"
thiserror = "2.0.11"
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
parking_lot = "0.12.1"
tokio = { version = "1.29.1", features = ["full"] }
futures = "0.3.28"
notify = "8.0.0"
walkdir = "2.3.3"
clap = { version = "4.5.0", features = ["derive"] }
tauri-plugin-clipboard-manager = "2.3.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(windows)".dependencies]
windows = { version = "0.52.0", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
